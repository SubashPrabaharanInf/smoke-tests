name: Login Branch Pipeline

on:
  push:
    branches:
      - 'deploy/login'
      - '*login*'
  pull_request:
    branches:
      - 'deploy/login'
      - '*login*'
  workflow_dispatch:

jobs:
  test-login:
    name: Run Login Tests Only
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright test --with-deps chromium
      
    - name: Run Login Tests Only
      run: npx playwright test tests/login.spec.js 
      
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: login-playwright-report
        path: playwright-report/
        retention-days: 30
