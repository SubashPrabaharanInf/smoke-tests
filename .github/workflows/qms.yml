name: QMS Dashboard Pipeline

on:
  push:
    branches:
      - 'dashboard/qms'
      - '*qms*'
  pull_request:
    branches:
      - 'dashboard/qms'
      - '*qms*'
  workflow_dispatch:

jobs:
  test-qms:
    name: Run QMS Tests Only
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run QMS Tests
      run: npm run test:qms
      
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: qms-playwright-report
        path: playwright-report/
        retention-days: 30
