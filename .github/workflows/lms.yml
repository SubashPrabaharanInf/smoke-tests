name: LMS Dashboard Pipeline

on:
  push:
    branches:
      - 'lms/dashboard'
      - 'dashboard-lms'
      - '*lms*'
  pull_request:
    branches:
      - 'lms/dashboard'
      - 'dashboard-lms'
      - '*lms*'
  workflow_dispatch:

jobs:
  test-lms:
    name: Run LMS Tests Only
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --project=chromium
      
    - name: Run LMS Tests
      run: npm run test:lms
      
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: lms-playwright-report
        path: playwright-report/
        retention-days: 30
